      targetPosition: left
      selected: false
      width: 244
      height: 90
      data:
        type: code
        title: 托梦检查与扣费单
        desc: 核心玩法在 Dify：检查碎片与余额，生成 -10 的账本载荷。
        selected: false
        code_language: python3
        code: "import json\n\nCOST = 10\n\n\ndef main(wallet_body: str, fragments_body: str) -> dict:\n    try:\n        wallet = json.loads(wallet_body or \"{}\")\n    except ValueError:\n        wallet = {\"ok\": False, \"message\": \"钱柜没有回话。\"}\n    try:\n        result = json.loads(fragments_body or \"{}\")\n    except ValueError:\n        result = {\"ok\": False, \"fragments\": [], \"message\": \"托梦机没有回话。\"}\n\n    balance = int(wallet.get(\"balance\") or 0) if wallet.get(\"ok\") else 0\n    if not wallet.get(\"ok\"):\n        return {\n            \"decision\": \"fail\",\n            \"fail_reason\": \"钱柜暂时打烊了：\" + (wallet.get(\"message\") or \"余额不可达。\"),\n            \"fragment_text\": \"\",\n            \"fragment_count\": 0,\n            \"ledger_body\": \"\",\n            \"balance\": balance,\n        }\n    if not result.get(\"ok\"):\n        return {\n            \"decision\": \"fail\",\n            \"fail_reason\": \"托梦机暂时打烊了：\" + (result.get(\"message\") or \"碎片检索不可达。\"),\n\
          \            \"fragment_text\": \"\",\n            \"fragment_count\": 0,\n            \"ledger_body\": \"\",\n            \"balance\": balance,\n        }\n    fragments = result.get(\"fragments\") or []\n    if not fragments:\n        return {\n            \"decision\": \"fail\",\n            \"fail_reason\": \"你还没在当铺留下任何东西，梦是拼不出来的。先去典当一段吧。\",\n            \"fragment_text\": \"\",\n            \"fragment_count\": 0,\n            \"ledger_body\": \"\",\n            \"balance\": balance,\n        }\n    if balance < COST:\n        return {\n            \"decision\": \"fail\",\n            \"fail_reason\": f\"托梦要 {COST} 枚记忆币，你只有 {balance} 枚。\",\n            \"fragment_text\": \"\",\n            \"fragment_count\": 0,\n            \"ledger_body\": \"\",\n            \"balance\": balance,\n        }\n    text = \"\\n\".join(\n        f\"- 《{item.get('title') or '无题'}》（{item.get('emotion') or '未命名'}）：\"\n        f\"{item.get('text') or ''}\"\n        for item in fragments\n    )\n\
          \    ledger_body = json.dumps(\n        {\"player_id\": \"\", \"turn_id\": \"\", \"delta\": -COST, \"reason\": \"托梦：把旧记忆缝在一起\"},\n        ensure_ascii=False,\n    )\n    return {\n        \"decision\": \"dream\",\n        \"fail_reason\": \"\",\n        \"fragment_text\": text,\n        \"fragment_count\": len(fragments),\n        \"ledger_body\": ledger_body,\n        \"balance\": balance,\n    }"
        outputs:
          decision:
            children: null
            type: string
          fail_reason:
            children: null
            type: string
          fragment_text:
            children: null
            type: string
          fragment_count:
            children: null
            type: number
          ledger_body:
            children: null
            type: string
          balance:
            children: null
            type: number
        variables:
        - variable: wallet_body
          value_selector:
          - dream_wallet
          - body
          value_type: string
        - variable: fragments_body
          value_selector:
          - dream_fragments
          - body

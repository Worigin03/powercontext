    - id: redeem_choose
      type: custom
      position:
        x: 1520
        y: -280
      sourcePosition: right
      targetPosition: left
      selected: false
      width: 244
      height: 90
      data:
        type: code
        title: 选票 · 算手续费
        desc: 核心玩法在 Dify：设置 0.35 相似度门槛，按 appraisal 与 similarity 计算手续费，判断余额是否足够。
        selected: false
        code_language: python3
        code: "import json\n\nMIN_MATCH = 0.35\n\n\ndef main(wallet_body: str, search_body: str, player_id: str, turn_id: str) -> dict:\n    try:\n        wallet = json.loads(wallet_body or \"{}\")\n    except ValueError:\n        wallet = {\"ok\": False, \"message\": \"钱柜没有回话。\"}\n    if not wallet.get(\"ok\"):\n        return {\n            \"decision\": \"fail\",\n            \"fail_reason\": \"柜台暂时打烊了：\" + (wallet.get(\"message\") or \"钱柜不可达。\"),\n            \"memory_id\": 0,\n            \"title\": \"\",\n            \"similarity\": 0,\n            \"cost\": 0,\n            \"exactness\": \"\",\n            \"balance\": 0,\n            \"commit_body\": \"\",\n        }\n    balance = int(wallet.get(\"balance\") or 0)\n\n    try:\n        result = json.loads(search_body or \"{}\")\n    except ValueError:\n        result = {\"ok\": False, \"items\": [], \"message\": \"检索柜没有回话。\"}\n    items = result.get(\"items\") or []\n    if not result.get(\"ok\"):\n        return {\n            \"\
          decision\": \"fail\",\n            \"fail_reason\": \"检索柜暂时打烊了：\" + (result.get(\"message\") or \"向量检索不可达。\"),\n            \"memory_id\": 0,\n            \"title\": \"\",\n            \"similarity\": 0,\n            \"cost\": 0,\n            \"exactness\": \"\",\n            \"balance\": balance,\n            \"commit_body\": \"\",\n        }\n    if not items:\n        return {\n            \"decision\": \"fail\",\n            \"fail_reason\": \"柜台上没有你当掉的记忆。先去典当一段吧。\",\n            \"memory_id\": 0,\n            \"title\": \"\",\n            \"similarity\": 0,\n            \"cost\": 0,\n            \"exactness\": \"\",\n            \"balance\": balance,\n            \"commit_body\": \"\",\n        }\n\n    best = items[0]\n    similarity = float(best.get(\"similarity\") or 0)\n    if similarity < MIN_MATCH:\n        return {\n            \"decision\": \"fail\",\n            \"fail_reason\": (\n                f\"最像的一张只有 {similarity:.2f}，低于掌柜敢认账的 {MIN_MATCH:.2f}。\"\n         \
          \       \"换一条更具体的线索，或者先去典当一段。\"\n            ),\n            \"memory_id\": 0,\n            \"title\": str(best.get(\"title\") or \"\"),\n            \"similarity\": similarity,\n            \"cost\": 0,\n            \"exactness\": \"\",\n            \"balance\": balance,\n            \"commit_body\": \"\",\n        }\n\n    appraisal = int(best.get(\"appraisal\") or 0)\n    factor = max(0.55, min(1.35, 1.55 - similarity))\n    cost = max(8, round(appraisal * factor))\n    if balance < cost:\n        return {\n            \"decision\": \"fail\",\n            \"fail_reason\": (\n                f\"赎回《{best.get('title')}》要 {cost} 枚记忆币，你只有 {balance} 枚。\"\n                \"再当一段故事吧。\"\n            ),\n            \"memory_id\": int(best.get(\"id\") or 0),\n            \"title\": str(best.get(\"title\") or \"\"),\n            \"similarity\": similarity,\n            \"cost\": cost,\n            \"exactness\": \"\",\n            \"balance\": balance,\n            \"commit_body\": \"\"\
          ,\n        }\n\n    if similarity >= 0.82:\n        exactness = \"几乎一字不差\"\n    elif similarity >= 0.55:\n        exactness = \"轮廓还在，边角被雨水泡软了\"\n    else:\n        exactness = \"只剩一个模糊的影子\"\n    commit_body = json.dumps(\n        {\n            \"player_id\": player_id,\n            \"memory_id\": int(best.get(\"id\") or 0),\n            \"fee\": cost,\n            \"turn_id\": turn_id,\n        },\n        ensure_ascii=False,\n    )\n    return {\n        \"decision\": \"commit\",\n        \"fail_reason\": \"\",\n        \"memory_id\": int(best.get(\"id\") or 0),\n        \"title\": str(best.get(\"title\") or \"\"),\n        \"similarity\": similarity,\n        \"cost\": cost,\n        \"exactness\": exactness,\n        \"balance\": balance,\n        \"commit_body\": commit_body,\n    }"
        outputs:
          decision:
            children: null
            type: string
          fail_reason:
            children: null
            type: string
          memory_id:
            children: null
            type: number
          title:
            children: null
            type: string
          similarity:
            children: null
            type: number
          cost:
            children: null
            type: number
          exactness:
            children: null
            type: string
          balance:
            children: null
            type: number
          commit_body:
            children: null
            type: string
        variables:
        - variable: wallet_body
          value_selector:
          - redeem_wallet
          - body
          value_type: string
        - variable: search_body
          value_selector:
          - redeem_search
          - body
          value_type: string
        - variable: player_id
          value_selector:
          - route
          - player_id
          value_type: string
        - variable: turn_id
          value_selector:
          - route
          - turn_id
          value_type: string

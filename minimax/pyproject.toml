[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-context"
version = "1.0.0"
description = "Spec-driven development context module backed by seekdb and PowerContext"
requires-python = ">=3.11"
dependencies = ["pymysql>=1.1", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sdd-context = "sdd_context.cli:main"

[tool.setuptools.packages.find]
include = ["sdd_context*"]

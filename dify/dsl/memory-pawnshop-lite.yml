  description: 一家开在城市缝隙里的记忆当铺。Dify 负责估价、手续费与分支，seekdb 负责语义向量检索与钱包账本。
  icon: 🏮
  icon_background: '#FFEAD5'
  icon_type: emoji
  input_placeholder: 说说你今天带了什么记忆来…
  privacy_policy: null
  show_workflow_steps: true
  title: 记忆当铺 · 离线版
  use_icon_as_answer_icon: false
version: 0.7.0

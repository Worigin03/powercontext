      data:
        type: code
        title: 估价 · 判味
        desc: 核心玩法在 Dify：细节浓度、感官颗粒、情绪、数字刻度、第一人称共同决定估价。
        selected: false
        code_language: python3
        code: "import json\nimport re\n\nSENSORY = (\n    \"雨\", \"雪\", \"风\", \"光\", \"灯\", \"味道\", \"气味\", \"香\", \"声音\", \"响\", \"烫\", \"凉\",\n    \"冰\", \"热\", \"沙\", \"海\", \"雾\", \"烟\", \"甜\", \"苦\", \"咸\", \"颜色\", \"红\", \"蓝\", \"白\",\n)\nEMOTION_WORDS = {\n    \"温柔\": (\"妈\", \"奶奶\", \"外婆\", \"猫\", \"拥抱\", \"手\", \"信\", \"晚安\", \"回家\", \"灯\"),\n    \"遗憾\": (\"没\", \"错过\", \"如果\", \"离开\", \"最后\", \"来不及\", \"本来\", \"可惜\", \"忘了\"),\n    \"狂喜\": (\"笑\", \"跳\", \"尖叫\", \"赢\", \"成功\", \"第一次\", \"终于\", \"炸开\", \"飞奔\"),\n    \"恐惧\": (\"怕\", \"黑\", \"血\", \"追\", \"坠\", \"锁\", \"尖叫\", \"躲\", \"颤抖\"),\n    \"酸涩\": (\"分手\", \"泪\", \"背影\", \"旧\", \"一个人\", \"车站\", \"空\", \"再见\", \"删\"),\n    \"平静\": (\"雨\", \"海\", \"散步\", \"午后\", \"茶\", \"书\", \"窗\", \"发呆\", \"慢慢\"),\n}\nNUMBER_RE = re.compile(r\"\\d|[一二三四五六七八九十百千万零两]\")\nPUNCT_RE = re.compile(r\"[\\s，。！？、,.!?;；:：\\\"'“”‘’()（）]+\")\n\n\ndef classify_emotion(text: str) -> str:\n    scores = {}\n    for name, words in EMOTION_WORDS.items():\n  \
          \      scores[name] = sum(text.count(word) for word in words)\n    best = max(scores, key=scores.get)\n    return best if scores[best] > 0 else \"未命名\"\n\n\ndef main(text: str, player_id: str, turn_id: str) -> dict:\n    text = (text or \"\").strip()\n    if len(text) < 10:\n        return {\n            \"can_pawn\": False,\n            \"title\": \"\",\n            \"emotion\": \"\",\n            \"appraisal\": 0,\n            \"reasons_line\": \"\",\n            \"store_body\": \"\",\n            \"ledger_body\": \"\",\n        }\n\n    coins = 25\n    reasons = []\n\n    detail = min(20, len(text) // 20)\n    coins += detail\n    if detail:\n        reasons.append(f\"细节浓度 +{detail}\")\n\n    sensory = sum(text.count(word) for word in SENSORY)\n    sensory_bonus = min(18, sensory * 3)\n    coins += sensory_bonus\n    if sensory_bonus:\n        reasons.append(f\"感官颗粒 +{sensory_bonus}\")\n\n    emotion = classify_emotion(text)\n    if emotion != \"未命名\":\n        coins += 10\n\
          \        reasons.append(f\"{emotion}余温 +10\")\n\n    if NUMBER_RE.search(text):\n        coins += 8\n        reasons.append(\"可核对的刻度 +8\")\n\n    if \"我\" in text:\n        coins += 4\n        reasons.append(\"第一人称 +4\")\n\n    coins = max(30, min(180, coins))\n    cleaned = PUNCT_RE.sub(\" \", text).strip()\n    title = (cleaned[:16] if cleaned else \"无题\")\n    reasons_line = \"、\".join(reasons) or \"干净、克制，像一张没写地址的明信片\"\n\n    store_body = json.dumps(\n        {\n            \"player_id\": player_id,\n            \"text\": text,\n            \"title\": title,\n            \"emotion\": emotion,\n            \"appraisal\": coins,\n        },\n        ensure_ascii=False,\n    )\n    ledger_body = json.dumps(\n        {\n            \"player_id\": player_id,\n            \"turn_id\": turn_id,\n            \"delta\": coins,\n            \"reason\": f\"典当《{title}》\",\n        },\n        ensure_ascii=False,\n    )\n    return {\n        \"can_pawn\": True,\n        \"title\": title,\n\
          \        \"emotion\": emotion,\n        \"appraisal\": coins,\n        \"reasons_line\": reasons_line,\n        \"store_body\": store_body,\n        \"ledger_body\": ledger_body,\n    }"
        outputs:
          can_pawn:
            children: null
            type: boolean
          title:
            children: null
            type: string
          emotion:
            children: null
            type: string
          appraisal:
            children: null
            type: number
          reasons_line:
            children: null
            type: string
          store_body:
            children: null
            type: string
          ledger_body:
            children: null
            type: string
        variables:
        - variable: text
          value_selector:
          - route
          - text
          value_type: string
        - variable: player_id
          value_selector:
          - route
          - player_id
          value_type: string
        - variable: turn_id
          value_selector:
          - route
          - turn_id
          value_type: string

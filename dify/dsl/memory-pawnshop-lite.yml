    opening_statement: '欢迎光临记忆当铺。


      你可以：把一段记忆当掉换记忆币、凭线索赎回旧当票、逛黑市看看别人的记忆、托梦把碎片缝成梦，或者查一查余额。

      先说说，你今天带什么来？'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我想当掉一段记忆：去年冬天奶奶在厨房煮姜汤，窗外下着雪。
    - 帮我赎回一段关东煮的记忆
    - 逛逛黑市，看看别人的秘密
    - 帮我把当掉的记忆缝成一个梦
    - 我还有多少记忆币？
    - 你好，这里怎么玩？
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    show_workflow_steps: true
